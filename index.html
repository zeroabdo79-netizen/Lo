<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider-Man - Exclusive HD Access</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1b0206 0%, #080002 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 420px;
      width: 100%;
      background: rgba(20, 20, 25, 0.9);
      border: 1px solid rgba(229, 9, 20, 0.4);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(229, 9, 20, 0.3);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .poster-box {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      margin-bottom: 20px;
    }

    .poster-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #e50914;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .rating {
      color: #ffc107;
      font-size: 14px;
      margin-bottom: 16px;
    }

    p.description {
      font-size: 14px;
      color: #cccccc;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .cta-btn {
      display: inline-block;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #e50914 0%, #b20710 100%);
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: pulse 2s infinite;
      border: none;
      cursor: pointer;
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(229, 9, 20, 0.6);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(229, 9, 20, 0); }
      100% { box-shadow: 0 0 0 0 rgba(229, 9, 20, 0); }
    }

    .progress-container {
      display: none;
      margin-top: 15px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #e50914;
      transition: width 0.3s;
    }

    .status-text {
      font-size: 12px;
      color: #aaa;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="poster-box">
      <span class="badge">4K ULTRA HD</span>
      <!-- Photo dyal Spider-Man -->
      <img src="https://encrypted-tbn0.gstatic.com/licensed-image?q=tbn:ANd9GcTCW2twAkI7RwLsjlnEGZ47FSdEDgy5fgGIoEsVuWinsf991U7EcJ-kgmosPO1ApUTQFCmpiWhjzHgIvQw" alt="Spider-Man Movie Poster">
    </div>

    <h1>Spider-Man: Full Movie HD</h1>
    <div class="rating">★★★★★ 4.9/5 (14,210 votes)</div>
    
    <p class="description">
      Watch the complete movie in high definition. Click the button below to verify stream access.
    </p>

    <!-- BADDAL "https://YOUR_CPA_LINK_HERE.com" B LIEN CPA DYALAK -->
    <a href="https://appsave.site/cl/i/pqokmn?preview=1" id="cpa-btn" class="cta-btn" onclick="handleClick(event)">
      ▶ WATCH MOVIE NOW
    </a>

    <div class="progress-container" id="progress-box">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="status-text" id="status-text">Connecting to stream...</div>
    </div>
  </div>

  <script>
    function handleClick(event) {
      const cpaUrl = event.currentTarget.getAttribute('href');
      
      // Ila ba9i mabaddaltich lien dyalak
      if (cpaUrl.includes("YOUR_CPA_LINK_HERE")) {
        event.preventDefault();
        alert("Khassak tbaddal 'YOUR_CPA_LINK_HERE' f koud HTML b lien dyal CPA offer dyalak!");
        return;
      }

      // Simulation dyal loading animation bach tzidd f Conversion Rate (CTR)
      event.preventDefault();
      const btn = document.getElementById('cpa-btn');
      const progressBox = document.getElementById('progress-box');
      const progressFill = document.getElementById('progress-fill');
      const statusText = document.getElementById('status-text');

      btn.style.display = 'none';
      progressBox.style.display = 'block';

      let step = 0;
      const steps = [
        { percent: "35%", text: "Verifying server connection..." },
        { percent: "75%", text: "Unlocking HD stream..." },
        { percent: "100%", text: "Redirecting to stream..." }
      ];

      const interval = setInterval(() => {
        if (step < steps.length) {
          progressFill.style.width = steps[step].percent;
          statusText.innerText = steps[step].text;
          step++;
        } else {
          clearInterval(interval);
          window.location.href = cpaUrl;
        }
      }, 600);
    }
  </script>

</body>
</html>
